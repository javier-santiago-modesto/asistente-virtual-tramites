<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vista previa · Asistente Virtual de Trámites Académicos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%231b2438%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27none%27 stroke=%27white%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Josefin+Sans:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Pinyon+Script&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tema.css">
<link rel="stylesheet" href="/static/preview.css">
</head>
<body>
<header class="top">
  <a class="inst" href="/" aria-label="Universidad Inteligente, volver al asistente"><svg class="inst__logo" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 3 6 9v14c0 11 7.5 18.5 18 22 10.5-3.500 18-11 18-22V9z"/><path d="M24 17v18M24 17c-3-2-7-2.500-11-2v15c4-.5 8 0 11 2 3-2 7-2.500 11-2V15c-4-.5-8 0-11 2z" stroke-width="1.700"/><circle cx="24" cy="10.500" r="1.800" fill="currentColor" stroke="none"/><circle cx="14.500" cy="20" r="1.200" fill="currentColor" stroke="none"/><circle cx="33.500" cy="20" r="1.200" fill="currentColor" stroke="none"/></svg><span class="inst__nombre">Universidad Inteligente</span><span class="inst__sep" aria-hidden="true"></span><span class="inst__portal">Portal del Estudiante</span></a>
  <ol class="pasos" id="pasos" aria-label="Avance del trámite">
    <li class="activo">Vista previa</li><li>Confirmación</li><li>Pago</li><li>Entrega</li>
  </ol>
</header>

<main class="layout">
  <section class="escenario" id="escenario" aria-label="Vista previa del documento">
    <div id="estado" class="estado" role="status">Preparando tu vista previa…</div>
    <div class="doc-wrap" id="docWrap" hidden><div class="doc-escala" id="docEscala"></div></div>
  </section>

  <aside class="panel" id="panel" hidden aria-label="Resumen del trámite">
    <p class="panel__etq">Tu trámite</p>
    <h1 id="pTramite"></h1>
    <p class="panel__alumno" id="pAlumno"></p>
    <dl class="datos">
      <div><dt>Entrega</dt><dd id="pEntrega"></dd></div>
      <div><dt>Código del documento</dt><dd id="pCodigo"></dd></div>
    </dl>
    <p class="precio"><span>Total a pagar</span><b id="pPrecio"></b></p>
    <div id="pAccion"></div>
    <a class="volver" href="/">← Volver al asistente</a>
  </aside>
</main>

<!-- Ventana flotante: información de pago -->
<dialog id="dlgPago" class="dlg" aria-labelledby="dlgTitulo">
  <form method="dialog" class="dlg__cerrar"><button aria-label="Cerrar">×</button></form>
  <div class="dlg__cuerpo" id="dlgCuerpo"></div>
</dialog>

<script src="/static/preview.js"></script>
</body>
</html>
